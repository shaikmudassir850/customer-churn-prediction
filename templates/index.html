<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChurnIQ | Customer Churn Prediction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, rgba(99,102,241,0.18), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(139,92,246,0.15), transparent 30%),
                #080d1c;
            color: #f8fafc;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 18px;
            box-shadow: 0 15px 40px rgba(99,102,241,0.3);
        }

        h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 15px;
        }

        .card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(148,163,184,0.15);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
            backdrop-filter: blur(15px);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 9px;
        }

        input,
        select {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border-radius: 14px;
            border: 1px solid #263252;
            background: #0b1224;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: 0.25s;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #0b1224;
            color: white;
        }

        .full {
            grid-column: 1 / -1;
        }

        .predict-btn {
            width: 100%;
            height: 56px;
            margin-top: 30px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 15px 35px rgba(99,102,241,0.25);
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 45px rgba(99,102,241,0.35);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            background: rgba(99,102,241,0.10);
            border: 1px solid rgba(99,102,241,0.25);
        }

        .result h2 {
            font-size: 20px;
            margin-bottom: 7px;
        }

        .result p {
            color: #94a3b8;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 30px;
            }

            .card {
                padding: 24px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">C</div>

        <h1>Customer Churn Prediction</h1>

        <p class="subtitle">
            Predict whether a customer is likely to churn using customer behavior data.
        </p>
    </div>


    <div class="card">

        <div class="section-title">
            Customer Information
        </div>

        <form id="predictionForm">

            <div class="grid">

                <!-- Tenure -->
                <div class="field">
                    <label>Tenure (Months)</label>

                    <input
                        type="number"
                        id="tenure_months"
                        name="tenure_months"
                        placeholder="e.g. 24"
                        min="0"
                        required
                    >
                </div>


                <!-- Contract -->
                <div class="field">
                    <label>Contract Type</label>

                    <select id="contract_type" name="contract_type" required>

                        <option value="">Select contract type</option>

                        <option value="0">Month-to-month</option>

                        <option value="1">One year</option>

                        <option value="2">Two year</option>

                    </select>
                </div>


                <!-- Monthly Charges -->
                <div class="field">
                    <label>Monthly Charges</label>

                    <input
                        type="number"
                        id="monthly_charges"
                        name="monthly_charges"
                        placeholder="e.g. 65.50"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>


                <!-- Total Charges -->
                <div class="field">
                    <label>Total Charges</label>

                    <input
                        type="number"
                        id="total_charges"
                        name="total_charges"
                        placeholder="e.g. 1500"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>


                <!-- PAYMENT METHOD -->
                <div class="field">
                    <label>Payment Method</label>

                    <select id="payment_method" name="payment_method" required>

                        <option value="">Select payment method</option>

                        <option value="0">Bank transfer</option>

                        <option value="1">Credit card</option>

                        <option value="2">Electronic check</option>

                        <option value="3">Mailed check</option>

                    </select>
                </div>


                <!-- Average Usage -->
                <div class="field">
                    <label>Average Monthly Usage (GB)</label>

                    <input
                        type="number"
                        id="avg_monthly_usage_gb"
                        name="avg_monthly_usage_gb"
                        placeholder="e.g. 35"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>


                <!-- Satisfaction -->
                <div class="field">
                    <label>Satisfaction Score</label>

                    <input
                        type="number"
                        id="satisfaction_score"
                        name="satisfaction_score"
                        placeholder="1 - 10"
                        min="1"
                        max="10"
                        step="0.1"
                        required
                    >
                </div>


                <!-- Autopay -->
                <div class="field">
                    <label>AutoPay Enabled</label>

                    <select id="autopay_enabled" name="autopay_enabled" required>

                        <option value="">Select option</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>
                </div>

            </div>


            <button type="submit" class="predict-btn">
                Predict Customer Churn
            </button>

        </form>


        <!-- Result -->
        <div id="result" class="result hidden">

            <h2 id="resultTitle"></h2>

            <p id="resultText"></p>

        </div>

    </div>


    <div class="footer">
        ChurnIQ
    </div>

</div>


<script>

    const form = document.getElementById("predictionForm");

    const resultBox = document.getElementById("result");

    const resultTitle = document.getElementById("resultTitle");

    const resultText = document.getElementById("resultText");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const data = {

            tenure_months:
                Number(document.getElementById("tenure_months").value),

            contract_type:
                Number(document.getElementById("contract_type").value),

            monthly_charges:
                Number(document.getElementById("monthly_charges").value),

            total_charges:
                Number(document.getElementById("total_charges").value),

            payment_method:
                Number(document.getElementById("payment_method").value),

            avg_monthly_usage_gb:
                Number(document.getElementById("avg_monthly_usage_gb").value),

            satisfaction_score:
                Number(document.getElementById("satisfaction_score").value),

            autopay_enabled:
                Number(document.getElementById("autopay_enabled").value)

        };


        try {

            const response = await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });


            const result = await response.json();


            resultBox.classList.remove("hidden");


            if (result.prediction === 1 || result.prediction === "1") {

                resultTitle.innerHTML = "⚠️ Customer Likely to Churn";

                resultText.innerHTML =
                    "This customer has a higher probability of leaving the service.";

            }

            else {

                resultTitle.innerHTML = "✓ Customer Likely to Stay";

                resultText.innerHTML =
                    "This customer has a lower probability of churning.";

            }


        }

        catch (error) {

            resultBox.classList.remove("hidden");

            resultTitle.innerHTML = "Something went wrong";

            resultText.innerHTML =
                "Unable to connect to the prediction server.";

            console.error(error);

        }

    });

</script>

</body>
</html>
